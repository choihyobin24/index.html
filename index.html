<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생용 올인원 웹앱</title>
  
  <!-- Google Fonts: Jua, Gaegu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          },
          fontFamily: {
            jua: ['Jua', 'sans-serif'],
            gaegu: ['Gaegu', 'cursive']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Jua', sans-serif;
      background-color: #f0f9ff;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #bfdbfe;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-blue-50/50 text-slate-800 min-h-screen pb-12">

  <!-- Header Section -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <h1 class="text-2xl sm:text-3xl font-jua tracking-wide flex items-center gap-2">
        <span>🎓</span> 학생용 올인원 웹앱
      </h1>
      <nav class="flex gap-2 text-sm sm:text-base">
        <a href="#timer-section" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded-full transition">타이머</a>
        <a href="#dday-section" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded-full transition">D-Day</a>
        <a href="#snack-section" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded-full transition">매점 룰렛</a>
        <a href="#split-section" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded-full transition">N빵 정산</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-8">

    <!-- Chapter 1: 과목별 시험/모의고사 타이머 -->
    <section id="timer-section" class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
      <h2 class="text-xl text-blue-600 font-bold mb-4 flex items-center gap-2">
        <span>⏱️</span> Chapter 1. 시험 & 모의고사 타이머
      </h2>
      
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-6">
        <button onclick="setTimer(50, '자율공부')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-3 rounded-2xl text-sm border border-blue-200 transition">자율 50분</button>
        <button onclick="setTimer(80, '국어')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-3 rounded-2xl text-sm border border-blue-200 transition">국어 80분</button>
        <button onclick="setTimer(100, '수학')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-3 rounded-2xl text-sm border border-blue-200 transition">수학 100분</button>
        <button onclick="setTimer(70, '영어')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-3 rounded-2xl text-sm border border-blue-200 transition">영어 70분</button>
        <button onclick="setTimer(40, '탐구')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-3 rounded-2xl text-sm border border-blue-200 transition">탐구 40분</button>
      </div>

      <div class="bg-blue-50/70 p-6 rounded-2xl text-center mb-6 border border-blue-100">
        <div id="subject-label" class="text-blue-500 text-lg mb-1">과목을 선택해주세요</div>
        <div id="timer-display" class="text-5xl font-mono font-bold text-blue-600 tracking-wider">00:00</div>
      </div>

      <div class="flex justify-center gap-3">
        <button onclick="startTimer()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition">시작</button>
        <button onclick="pauseTimer()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-2.5 rounded-full font-bold transition">일시정지</button>
        <button onclick="resetTimer()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-2.5 rounded-full font-bold transition">리셋</button>
      </div>
    </section>

    <!-- Chapter 2: D-Day 및 시험 카운트다운 -->
    <section id="dday-section" class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
      <h2 class="text-xl text-blue-600 font-bold mb-4 flex items-center gap-2">
        <span>📅</span> Chapter 2. D-Day 카운트다운
      </h2>

      <div class="flex flex-col sm:flex-row gap-2 mb-6">
        <input type="text" id="dday-title" placeholder="일정 이름 (예: 중간고사)" class="flex-1 px-4 py-2 rounded-2xl border border-slate-200 focus:outline-none focus:border-blue-500 font-gaegu text-lg" />
        <input type="date" id="dday-date" class="px-4 py-2 rounded-2xl border border-slate-200 focus:outline-none focus:border-blue-500" />
        <button onclick="addDDay()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-2xl font-bold transition">추가</button>
      </div>

      <div id="dday-list" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-1"></div>
    </section>

    <!-- Chapter 3: 우리 학교 매점 간식 추천 룰렛 -->
    <section id="snack-section" class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
      <h2 class="text-xl text-blue-600 font-bold mb-4 flex items-center gap-2">
        <span>🥨</span> Chapter 3. 매점 간식 추천 룰렛
      </h2>

      <div class="bg-blue-50/70 p-6 rounded-2xl text-center mb-6 border border-blue-100">
        <div id="snack-result" class="text-2xl font-bold text-blue-600 mb-2">무엇을 먹을까?</div>
        <div id="snack-tip" class="text-slate-500 text-sm font-gaegu text-base">버튼을 눌러 매점 간식을 추천받아 보세요!</div>
      </div>

      <div class="text-center">
        <button onclick="pickSnack()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold shadow-md transition text-lg">
          간식 뽑기 🎲
        </button>
      </div>
    </section>

    <!-- Chapter 4: N빵 정산 계산기 -->
    <section id="split-section" class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
      <h2 class="text-xl text-blue-600 font-bold mb-4 flex items-center gap-2">
        <span>💸</span> Chapter 4. N빵 정산 계산기
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-slate-600 text-sm mb-1">총 금액 (원)</label>
          <input type="number" id="total-amount" placeholder="예: 15000" class="w-full px-4 py-2 rounded-2xl border border-slate-200 focus:outline-none focus:border-blue-500" />
        </div>
        <div>
          <label class="block text-slate-600 text-sm mb-1">인원 수 (명)</label>
          <input type="number" id="total-people" placeholder="예: 3" class="w-full px-4 py-2 rounded-2xl border border-slate-200 focus:outline-none focus:border-blue-500" />
        </div>
      </div>

      <button onclick="calculateSplit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-2xl font-bold transition mb-4">
        계산하기
      </button>

      <div id="split-result-box" class="hidden bg-blue-50/70 p-4 rounded-2xl border border-blue-100">
        <div id="split-result-text" class="text-slate-700 font-gaegu text-xl mb-3 leading-relaxed"></div>
        <button onclick="copySplitText()" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 py-2 rounded-xl text-sm font-bold transition">
          정산 내역 복사하기 📋
        </button>
      </div>
    </section>

  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPPXswC1ursj13b3CFPgLuh5D5QzrQfz0",
      authDomain: "student-2c849.firebaseapp.com",
      projectId: "student-2c849",
      storageBucket: "student-2c849.firebasestorage.app",
      messagingSenderId: "440876925265",
      appId: "1:440876925265:web:0329ca5b7bc468f90b5370"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    signInAnonymously(auth).catch((error) => {
      console.log("Firebase Auth Info:", error.message);
    });
  </script>

  <!-- Main Logic -->
  <script>
    let timerInterval = null;
    let totalSeconds = 0;
    let currentSubject = "";

    function setTimer(minutes, subject) {
      pauseTimer();
      totalSeconds = minutes * 60;
      currentSubject = subject;
      document.getElementById('subject-label').innerText = `[${subject}] 진행 중`;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startTimer() {
      if (totalSeconds <= 0 || timerInterval) return;
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          alert(`[${currentSubject}] 시간이 완료되었습니다!`);
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = 0;
      document.getElementById('subject-label').innerText = "과목을 선택해주세요";
      document.getElementById('timer-display').innerText = "00:00";
    }

    let ddayItems = [
      { id: 1, title: '2027 수능', date: '2026-11-19' }
    ];

    function renderDDay() {
      const listEl = document.getElementById('dday-list');
      listEl.innerHTML = '';
      const today = new Date();
      today.setHours(0,0,0,0);

      ddayItems.forEach(item => {
        const targetDate = new Date(item.date);
        targetDate.setHours(0,0,0,0);
        const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
        
        let ddayText = '';
        if (diffDays > 0) ddayText = `D-${diffDays}`;
        else if (diffDays === 0) ddayText = 'D-DAY';
        else ddayText = `D+${Math.abs(diffDays)}`;

        const card = document.createElement('div');
        card.className = 'flex justify-between items-center bg-blue-50/50 px-4 py-3 rounded-2xl border border-blue-100';
        card.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${item.title}</span>
            <span class="text-xs text-slate-400 ml-2">${item.date}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-blue-600 font-bold font-mono text-lg">${ddayText}</span>
            <button onclick="deleteDDay(${item.id})" class="text-slate-400 hover:text-red-500 text-sm">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function addDDay() {
      const titleInput = document.getElementById('dday-title');
      const dateInput = document.getElementById('dday-date');

      if (!titleInput.value || !dateInput.value) {
        alert('제목과 날짜를 입력해주세요!');
        return;
      }

      ddayItems.push({
        id: Date.now(),
        title: titleInput.value,
        date: dateInput.value
      });

      titleInput.value = '';
      dateInput.value = '';
      renderDDay();
    }

    function deleteDDay(id) {
      ddayItems = ddayItems.filter(item => item.id !== id);
      renderDDay();
    }

    const snacks = [
      { name: "꼬깔콘 매콤달콤한맛", tip: "바삭함과 매콤함의 최고 조합!" },
      { name: "허니버터칩", tip: "달콤짭조름해서 당 충전에 딱!" },
      { name: "초코파이", tip: "전자레인지에 10초 돌려먹으면 극락!" },
      { name: "네모스낵", tip: "쉬는시간 순삭 보장 간식!" },
      { name: "설곤약", tip: "쫄깃한 식감 최강자!" },
      { name: "요맘때", tip: "상큼한 유산균 아이스크림!" },
      { name: "망고주스", tip: "달콤 시원한 망고 향가득!" },
      { name: "보성녹차", tip: "깔끔하게 입가심하기 최고!" },
      { name: "스팸마요컵밥", tip: "든든한 한 끼 대용으로 딱!" },
      { name: "참치마요컵밥", tip: "호불호 없는 매점 베스트셀러!" },
      { name: "핫도그", tip: "케찹 듬뿍 뿌려서 먹기!" },
      { name: "츄파춥스 젤리", tip: "상큼함이 필요할 때 강추!" },
      { name: "천하장사 소시지", tip: "간편하고 알찬 영양 간식!" }
    ];

    function pickSnack() {
      const resEl = document.getElementById('snack-result');
      const tipEl = document.getElementById('snack-tip');
      
      let counter = 0;
      const interval = setInterval(() => {
        const randIndex = Math.floor(Math.random() * snacks.length);
        resEl.innerText = snacks[randIndex].name;
        counter++;
        if (counter > 10) {
          clearInterval(interval);
          const finalPick = snacks[Math.floor(Math.random() * snacks.length)];
          resEl.innerText = finalPick.name;
          tipEl.innerText = `💡 꿀조합 팁: ${finalPick.tip}`;
        }
      }, 100);
    }

    let lastSplitResult = "";

    function calculateSplit() {
      const amount = parseInt(document.getElementById('total-amount').value);
      const people = parseInt(document.getElementById('total-people').value);

      if (!amount || !people || people <= 0) {
        alert('올바른 금액과 인원수를 입력해 주세요!');
        return;
      }

      const perPerson = Math.ceil(amount / people);
      const resultBox = document.getElementById('split-result-box');
      const resultText = document.getElementById('split-result-text');

      lastSplitResult = `총 ${amount.toLocaleString()}원 / ${people}명\n👉 1인당: ${perPerson.toLocaleString()}원`;
      resultText.innerText = lastSplitResult;
      resultBox.classList.remove('hidden');
    }

    function copySplitText() {
      if (!lastSplitResult) return;
      navigator.clipboard.writeText(lastSplitResult).then(() => {
        alert('정산 내역이 클립보드에 복사되었습니다!');
      });
    }

    renderDDay();
  </script>
</body>
</html>
